name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · Types · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

      # Os placeholders são determinísticos: regenerar não pode produzir diff.
      # Se produzir, o commit está fora de sincronia com o gerador.
      - name: Assets placeholder estão em sincronia
        run: |
          npm run art:placeholders
          git diff --exit-code -- public/assets src/assets/sprite-manifest.generated.ts docs/ASSET_INVENTORY.md

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
